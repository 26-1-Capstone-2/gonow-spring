spring:
  application:
    name: gonow

  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: root
    password: pwd1234

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    property-naming-strategy: SNAKE_CASE

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: SL21AtKG1c3LRN2KKfhBcrc0Tlrxj6ACifgADCcT7VO5H+y7XrUoo/CLK/PME7sflGtc7eFvv55N4pq4vf43VQ==
  expiration: 10080 # 7일

springdoc:
  swagger-ui:
    path: /docs

flask:
  url: http://localhost:5000 # 로컬 개발용 — WSL 등에서 플라스크를 직접 띄워서 테스트

firebase:
  credential: classpath:firebase-service-account.json

scheduler:
  # 새벽 4시: SCHEDULED → READY 전환 기준 시각
  # ArrivedTransitionService의 날짜 보정(day-boundary-hour)과 반드시 동일하게 유지
  ready-transition-cron: "0 0 4 * * *"
  day-boundary-hour: 4

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://my-db:3306/mydb
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  data:
    redis:
      host: my-valkey
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN            # 로컬 블록의 DEBUG(SQL 전문 출력)를 운영에서 명시적으로 잠금
    org.hibernate.orm.jdbc.bind: WARN  # 로컬 블록의 TRACE(바인딩 값 출력)를 운영에서 명시적으로 잠금 — 개인정보 포함 가능

jwt:
  secret: ${JWT_SECRET_PROD}

flask:
  url: http://172.31.34.244:5000 # EC2 private IP (플라스크와 같은 EC2, 별도 docker run으로 떠 있음)
