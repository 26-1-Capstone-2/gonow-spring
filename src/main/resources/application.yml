---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://my-db:3306/mydb
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

