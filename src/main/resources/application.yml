spring:
  application:
    name: gonow

  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: root
    password: pwd1234

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  jackson:
    property-naming-strategy: SNAKE_CASE


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: SL21AtKG1c3LRN2KKfhBcrc0Tlrxj6ACifgADCcT7VO5H+y7XrUoo/CLK/PME7sflGtc7eFvv55N4pq4vf43VQ==
  expiration: 10080 # 7일

springdoc:
  swagger-ui:
    path: /docs

flask:
  url: http://15.164.215.15:5000

scheduler:
  # 새벽 4시: SCHEDULED → READY 전환 기준 시각
  # ArrivedTransitionService의 날짜 보정(day-boundary-hour)과 반드시 동일하게 유지
  ready-transition-cron: "0 0 4 * * *"
  day-boundary-hour: 4

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://my-db:3306/mydb
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO

jwt:
  secret: ${JWT_SECRET_PROD}
  expiration: 10080 # 7일
