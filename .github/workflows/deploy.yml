name: Deploy to EC2 ( Docker version )

on:
  push:
    branches: [ main ] # main 브랜치에 코드가 올라가면 작전을 개시합니다.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 빌드 속도를 비약적으로 높여줍니다.
      - name: Gradle 캐시 설정
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Firebase 서비스 계정 키 파일 복원 (빌드 전에 복원해야 JAR 안에 포함됨)
      - name: Firebase 서비스 계정 키 파일 생성
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > src/main/resources/firebase-service-account.json

      # 실행 권한 부여 및 깨끗한 빌드 수행
      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      # 빌드된 JAR 파일의 이름을 project.jar 로 고정하여 관리를 단순화합니다.
      - name: JAR 이름 변경
        run: mv build/libs/*SNAPSHOT.jar project.jar

      # [ 핵심 전송 ] 운영에 필요한 JAR, Dockerfile, compose.yml 3형제를 보냅니다.
      - name: EC2 에 파일 전송 ( SCP )
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project.jar,Dockerfile,compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/gonow"

      - name: EC2 에 서 Docker 실행 ( SSH )
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/gonow

            # 1. 이전 설정 확실히 정리 (prod 프로파일 포함)
            docker compose --profile prod down

            # 2. .env 파일 깨끗하게 새로 만들기
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
            echo "JWT_SECRET_PROD=${{ secrets.JWT_SECRET_PROD }}" >> .env
            echo "SES_SMTP_USERNAME=${{ secrets.SES_SMTP_USERNAME }}" >> .env
            echo "SES_SMTP_PASSWORD=${{ secrets.SES_SMTP_PASSWORD }}" >> .env

            # 3. JAR 파일 위치 세팅
            mkdir -p build/libs
            mv project.jar build/libs/app.jar

            # 4. 재시작 (환경 변수는 도커가 .env를 알아서 읽으므로 뒤에만 적어줘도 됩니다)
            docker compose --profile prod up --build -d

            # 5. 서버 저장 공간 확보를 위해 미사용 이미지를 정리합니다.
            docker image prune -f
