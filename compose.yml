services:
  my-db:
    image: mysql:9.7.2
    # [ 공통 설정 ] 로컬에서는 이 대로 실행 됩니다 .
    restart: unless-stopped  # 크래시 시 자동 재시작하되, 점검 등으로 직접 멈춘 경우 재부팅돼도 그대로 유지
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pwd1234} # 로컬 & prod 비번
      MYSQL_DATABASE: mydb
      TZ: Asia/Seoul
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    # [ 운영 환경 에서 만 덮어쓰기 ]
    # 이 부분 은 파일 에 적혀 있어 도 , 환경 변수 가 주입 되지 않으 면
    # 로컬 에 서 는 아무런 영향 을 주지 않 습 니 다 .
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-pwd1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

  my-valkey:
    image: valkey/valkey:9.1-alpine # Redis 포크(BSD-3, OSI 인증) — 프로토콜/명령어 완전 호환이라 스프링 쪽 코드/설정은 Redis와 동일
    restart: unless-stopped  # 크래시 시 자동 재시작하되, 점검 등으로 직접 멈춘 경우 재부팅돼도 그대로 유지
    ports:
      - "6379:6379" # "로컬 전용, prod에선 안 쓰임"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 인증코드/Refresh Token처럼 유실돼도 재요청/재로그인으로 복구되는 휘발성 데이터만 저장
    # 영속 volume/비밀번호 인증 없이 단순하게 운영 (같은 docker 네트워크 내부에서만 접근 가능)

  my-server:
    build: .
    # [ 운영 전용 서비스 ] profiles 가 붙어 있어 서 로컬 up 명령 시 무시 됩니다 .
    profiles:
      - prod
    restart: unless-stopped  # 크래시 시 자동 재시작하되, 점검 등으로 직접 멈춘 경우 재부팅돼도 그대로 유지
    environment:
      SPRING_PROFILES_ACTIVE: prod # 스프링 부트 prod 프로파일을 활성화해줌
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # GitHub Secrets 에서 주입
      JWT_SECRET_PROD: ${JWT_SECRET_PROD}         # GitHub Secrets 에서 주입
    ports:
      - "80:8080"
    depends_on:
      my-db:
        condition: service_healthy
      my-valkey:
        condition: service_healthy